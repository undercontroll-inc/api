services:
  main-service:
    image: ghcr.io/undercontroll-inc/core-api:latest
    container_name: main-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://${DB_HOST}:5432/undercontroll
      DB_DRIVER: org.postgresql.Driver
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      ACCESS_KEY_ID: ${ACCESS_KEY_ID}
      SECRET_ACCESS_KEY: ${SECRET_ACCESS_KEY}
      SESSION_TOKEN: ${SESSION_TOKEN}
      S3_EXPORT_BUCKET: ${S3_EXPORT_BUCKET}
      S3_UPLOAD_BUCKET: ${S3_UPLOAD_BUCKET}
      S3_READ_EXPIRATION_MINUTES: ${S3_READ_EXPIRATION_MINUTES:-1440}
    volumes:
      - /opt/app/firebase-service-account.json:/opt/app/firebase-service-account.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    networks:
      - backend-network
networks:
  backend-network:
    driver: bridge
