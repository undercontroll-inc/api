name: CD - Main Branch

on:
  workflow_run:
    workflows: ["CI - Main Branch"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-service-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    permissions:
      contents: read
      packages: write
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/undercontroll-inc/core-api:latest
            ghcr.io/undercontroll-inc/core-api:${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy to EC2 (via bastion)
    needs: publish
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy via SSH jump
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DB_HOST: ${{ vars.DB_HOST != '' && vars.DB_HOST || secrets.DB_HOST }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RABBITMQ_HOST: ${{ vars.RABBITMQ_HOST != '' && vars.RABBITMQ_HOST || secrets.RABBITMQ_HOST }}
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          FIREBASE_SA_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}
        with:
          host: ${{ vars.BACKEND_EC2_HOST_1 }},${{ vars.BACKEND_EC2_HOST_2 }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          proxy_host: ${{ vars.BASTION_HOST }}
          proxy_username: ${{ secrets.EC2_USERNAME }}
          proxy_key: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          envs: IMAGE_TAG,GH_TOKEN,GH_OWNER,GH_PAT,DB_HOST,DB_USERNAME,DB_PASSWORD,RABBITMQ_HOST,RABBITMQ_USER,RABBITMQ_PASSWORD,JWT_SECRET,MAIL_HOST,MAIL_PORT,MAIL_USERNAME,MAIL_PASSWORD,ACCESS_KEY_ID,SECRET_ACCESS_KEY,SESSION_TOKEN,FIREBASE_SA_B64
          script: |
            set -euo pipefail

            docker logout ghcr.io || true
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_OWNER" --password-stdin

            mkdir -p /opt/app
            rm -f /opt/app/firebase-service-account.json
            echo "${FIREBASE_SA_B64}" | base64 -d > /opt/app/firebase-service-account.json
            chmod 644 /opt/app/firebase-service-account.json

            cat > /opt/app/.env <<EOF
            DB_HOST=${DB_HOST}
            DB_USERNAME=${DB_USERNAME}
            DB_PASSWORD=${DB_PASSWORD}
            RABBITMQ_HOST=${RABBITMQ_HOST}
            RABBITMQ_USER=${RABBITMQ_USER}
            RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            MAIL_HOST=${MAIL_HOST}
            MAIL_PORT=${MAIL_PORT}
            MAIL_USERNAME=${MAIL_USERNAME}
            MAIL_PASSWORD=${MAIL_PASSWORD}
            ACCESS_KEY_ID=${ACCESS_KEY_ID}
            SECRET_ACCESS_KEY=${SECRET_ACCESS_KEY}
            SESSION_TOKEN=${SESSION_TOKEN}
            EOF
            chmod 600 /opt/app/.env

            curl -fsSL \
              -H "Authorization: token ${GH_PAT}" \
              -H "Accept: application/vnd.github.v3.raw" \
              https://api.github.com/repos/undercontroll-inc/infra/contents/docker-compose.prod.yml \
              -o /opt/app/docker-compose.yml

            sed -i "s|ghcr.io/undercontroll-inc/core-api:latest|ghcr.io/undercontroll-inc/core-api:${IMAGE_TAG}|g" \
              /opt/app/docker-compose.yml

            docker compose --env-file /opt/app/.env -f /opt/app/docker-compose.yml pull main-service
            docker compose --env-file /opt/app/.env -f /opt/app/docker-compose.yml up -d main-service
            docker image prune -f

      - name: Smoke test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.BACKEND_EC2_HOST_1 }},${{ vars.BACKEND_EC2_HOST_2 }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          proxy_host: ${{ vars.BASTION_HOST }}
          proxy_username: ${{ secrets.EC2_USERNAME }}
          proxy_key: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            for i in $(seq 1 20); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' main-service 2>/dev/null || echo "missing")
              if [ "$STATUS" = "healthy" ]; then echo "main-service healthy"; exit 0; fi
              echo "attempt $i: status=${STATUS}, sleeping 5s"; sleep 5
            done
            docker logs --tail 100 main-service || true
            echo "main-service not healthy after 100s" >&2; exit 1
